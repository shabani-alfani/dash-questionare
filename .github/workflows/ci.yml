name: Code checks (no production deployment)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Ensure runtime secrets are not tracked
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$|(^|/)\.private-cache/|\.enc\.json$'; then
            echo 'Sensitive runtime files in Git index'; exit 1
          fi
